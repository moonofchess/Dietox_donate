name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 초록불만으로는 테스트가 실제로 돌았는지 알 수 없다. 0개여도 통과로 보이기 때문에
      # 결과 XML을 직접 세어 보고, 하나도 안 돌았으면 실패시킨다.
      - name: Check unit test results
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          for path in files:
              root = ET.parse(path).getroot()
              print(f'{root.get("name")}: {root.get("tests")} tests')
          print(f"TOTAL suites={len(files)} tests={tests} failures={failures} errors={errors} skipped={skipped}")

          if tests == 0:
              sys.exit("단위 테스트가 하나도 실행되지 않았습니다")
          if failures or errors:
              sys.exit("단위 테스트가 실패했습니다")
          PY

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Show lint report
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dietox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
